<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #fdfdfd;
        font-family: "Inter", system-ui, sans-serif;
        letter-spacing: -0.025em;
        color: #000000;
      }

      /* ---------- HOOK ---------- */
      #hook {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: "Inter", system-ui, sans-serif;
        font-size: 96px;
        font-weight: 700;
        line-height: 1.05;
        letter-spacing: -0.025em;
        color: #000000;
        text-align: center;
        width: 900px;
      }
      #hook .accent {
        color: #6633ff;
      }

      /* ---------- REVIEW CARD ---------- */
      #card-wrap {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 940px;
      }
      #card {
        width: 100%;
        background: #fdfdfd;
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        padding: 40px;
        display: flex;
        flex-direction: column;
        gap: 36px;
        box-shadow: 0px 2px 3px hsl(0 0% 0% / 0.08), 0px 1px 2px -1px hsl(0 0% 0% / 0.08);
        transform-origin: center center;
      }

      /* audio player row */
      #audio-row {
        height: 80px;
        background: #f5f5f5;
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 20px;
      }
      #audio-row .play-btn {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: #ffffff;
        border: 1px solid #e8e8ee;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      #audio-row .play-btn svg {
        width: 16px;
        height: 16px;
        fill: #525252;
      }
      #audio-row .audio-time {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #525252;
      }
      #audio-row .audio-track {
        flex: 1;
        height: 6px;
        background: #e8e8ee;
        border-radius: 3px;
        position: relative;
        overflow: hidden;
      }
      #audio-row .audio-progress {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 38%;
        background: #525252;
        border-radius: 3px;
      }
      #audio-row .audio-volume {
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #525252;
        font-size: 18px;
      }

      /* speaker timeline ribbon */
      #ribbon-wrap {
        position: relative;
        height: 64px;
      }
      #ribbon {
        position: relative;
        width: 100%;
        height: 56px;
        background: rgba(245, 245, 245, 0.4);
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        overflow: hidden;
        display: flex;
      }
      .seg {
        height: 100%;
        opacity: 0.9;
      }
      .seg.s0 {
        background: hsl(210, 80%, 55%);
      }
      .seg.s1 {
        background: hsl(150, 60%, 45%);
      }
      .seg.s2 {
        background: hsl(40, 90%, 55%);
      }
      #playhead {
        position: absolute;
        top: -2px;
        bottom: -2px;
        left: 38%;
        width: 2px;
        background: #000000;
        pointer-events: none;
      }

      /* hover popup */
      #popup {
        position: absolute;
        top: -150px;
        left: 47.5%;
        transform: translateX(-50%);
        width: 480px;
        background: #fcfcfc;
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        padding: 18px 22px;
        box-shadow: 0px 2px 3px hsl(0 0% 0% / 0.16), 0px 2px 4px -1px hsl(0 0% 0% / 0.16);
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      #popup .popup-head {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 22px;
        color: #525252;
        font-weight: 500;
      }
      #popup .popup-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: hsl(150, 60%, 45%);
      }
      #popup .popup-name {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #000000;
        font-weight: 600;
      }
      #popup .popup-time {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        color: #525252;
      }
      #popup .popup-text {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 22px;
        color: #000000;
        line-height: 1.4;
      }
      #popup::after {
        content: "";
        position: absolute;
        bottom: -9px;
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
        width: 16px;
        height: 16px;
        background: #fcfcfc;
        border-right: 1px solid #e8e8ee;
        border-bottom: 1px solid #e8e8ee;
      }

      /* speakers section */
      #speakers {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      #speakers .speakers-label {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 500;
        font-size: 22px;
        color: #525252;
        letter-spacing: -0.01em;
      }
      .speaker-row {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .speaker-row .speaker-code {
        font-family: "JetBrains Mono", monospace;
        font-size: 22px;
        color: #525252;
        width: 220px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .speaker-row .speaker-dot {
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }
      .speaker-row .speaker-dot.d0 {
        background: hsl(210, 80%, 55%);
      }
      .speaker-row .speaker-dot.d1 {
        background: hsl(150, 60%, 45%);
      }
      .speaker-row .speaker-dot.d2 {
        background: hsl(40, 90%, 55%);
      }
      .speaker-row .speaker-input {
        flex: 1;
        height: 64px;
        background: #ffffff;
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        padding: 0 22px;
        display: flex;
        align-items: center;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 24px;
        color: #000000;
      }
      .speaker-row .speaker-input.focused {
        border-color: #6633ff;
        box-shadow: 0 0 0 3px rgba(102, 51, 255, 0.12);
      }
      .input-caret {
        display: inline-block;
        width: 2px;
        height: 28px;
        background: #000000;
        margin-left: 2px;
        vertical-align: -5px;
        opacity: 0;
      }

      /* buttons row */
      #buttons {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 14px;
        margin-top: 8px;
      }
      .btn {
        height: 64px;
        padding: 0 28px;
        border-radius: 0.4rem;
        font-family: "Inter", system-ui, sans-serif;
        font-size: 22px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        letter-spacing: -0.01em;
      }
      .btn.ghost {
        background: transparent;
        color: #525252;
      }
      .btn.primary {
        background: #6633ff;
        color: #ffffff;
      }
      .btn.primary.inverted {
        background: #ffffff;
        color: #6633ff;
        border-color: #6633ff;
      }

      /* cursor */
      #cursor {
        position: absolute;
        top: 0;
        left: 0;
        width: 36px;
        height: 36px;
        pointer-events: none;
        z-index: 10;
        opacity: 0;
      }
      #cursor svg {
        width: 100%;
        height: 100%;
        filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.25));
      }

      /* toast */
      #toast {
        position: absolute;
        top: 40px;
        right: 40px;
        min-width: 420px;
        background: #ffffff;
        border: 1px solid #e8e8ee;
        border-radius: 0.4rem;
        padding: 22px 26px;
        box-shadow: 0px 2px 3px hsl(0 0% 0% / 0.16), 0px 2px 4px -1px hsl(0 0% 0% / 0.16);
        display: flex;
        flex-direction: column;
        gap: 8px;
        opacity: 0;
      }
      #toast .toast-title {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: #000000;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #toast .toast-check {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: #6633ff;
        color: #ffffff;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #toast .toast-link {
        font-family: "Inter", system-ui, sans-serif;
        font-size: 20px;
        color: #6633ff;
        text-decoration: underline;
        margin-left: 38px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="slice-1-vert"
      data-start="0"
      data-duration="8.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- HOOK -->
      <div
        id="hook"
        class="clip"
        data-start="0"
        data-duration="2.6"
        data-track-index="1"
      >
        Transcripts that know <span class="accent">who&rsquo;s talking.</span>
      </div>

      <!-- REVIEW CARD -->
      <div
        id="card-wrap"
        class="clip"
        data-start="2.2"
        data-duration="6.3"
        data-track-index="2"
      >
        <div id="card">
          <!-- audio player row (TOP) -->
          <div id="audio-row">
            <div class="play-btn">
              <svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9" /></svg>
            </div>
            <div class="audio-time">0:18</div>
            <div class="audio-track">
              <div class="audio-progress"></div>
            </div>
            <div class="audio-time">1:02</div>
            <div class="audio-volume">&#9834;</div>
          </div>

          <!-- speaker timeline ribbon (BELOW AUDIO) -->
          <div id="ribbon-wrap">
            <div id="ribbon">
              <div class="seg s0" data-seg="1" style="width: 8%"></div>
              <div class="seg s1" data-seg="2" style="width: 6%"></div>
              <div class="seg s0" data-seg="3" style="width: 10%"></div>
              <div class="seg s2" data-seg="4" style="width: 7%"></div>
              <div class="seg s1" data-seg="5" style="width: 12%"></div>
              <div class="seg s0" data-seg="6" style="width: 6%"></div>
              <div class="seg s2" data-seg="7" style="width: 9%"></div>
              <div class="seg s1" data-seg="8" style="width: 8%"></div>
              <div class="seg s0" data-seg="9" style="width: 7%"></div>
              <div class="seg s2" data-seg="10" style="width: 10%"></div>
              <div class="seg s1" data-seg="11" style="width: 9%"></div>
              <div class="seg s0" data-seg="12" style="width: 8%"></div>
            </div>
            <div id="playhead"></div>
            <!-- hover popup -->
            <div id="popup">
              <div class="popup-head">
                <span class="popup-dot"></span>
                <span class="popup-name">SPEAKER_01</span>
                <span class="popup-time">&middot; 0:18 &ndash; 0:23</span>
              </div>
              <div class="popup-text">
                API is signed off &mdash; frontend lands today, docs go out tomorrow.
              </div>
            </div>
          </div>

          <!-- speakers section (BELOW RIBBON) -->
          <div id="speakers">
            <div class="speakers-label">
              Speakers (rename to save with real names)
            </div>
            <div class="speaker-row">
              <div class="speaker-code">
                <span class="speaker-dot d0"></span>SPEAKER_00
              </div>
              <div class="speaker-input" id="input-0">
                <span id="input-0-text"></span><span class="input-caret" id="caret-0"></span>
              </div>
            </div>
            <div class="speaker-row">
              <div class="speaker-code">
                <span class="speaker-dot d1"></span>SPEAKER_01
              </div>
              <div class="speaker-input" id="input-1">
                <span id="input-1-text"></span><span class="input-caret" id="caret-1"></span>
              </div>
            </div>
            <div class="speaker-row">
              <div class="speaker-code">
                <span class="speaker-dot d2"></span>SPEAKER_02
              </div>
              <div class="speaker-input" id="input-2">
                <span id="input-2-text"></span><span class="input-caret" id="caret-2"></span>
              </div>
            </div>
          </div>

          <!-- buttons row (BOTTOM) -->
          <div id="buttons">
            <div class="btn ghost">Discard</div>
            <div class="btn primary" id="save-btn">Save</div>
          </div>
        </div>

        <!-- cursor (positioned absolute within card-wrap) -->
        <div id="cursor">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M3 2 L3 18 L8 14 L11 21 L14 19.5 L11 12.5 L18 12.5 Z"
              fill="#000000"
              stroke="#ffffff"
              stroke-width="1.2"
              stroke-linejoin="round"
            />
          </svg>
        </div>
      </div>

      <!-- TOAST -->
      <div
        id="toast"
        class="clip"
        data-start="7.9"
        data-duration="0.6"
        data-track-index="3"
      >
        <div class="toast-title">
          <span class="toast-check">&#10003;</span>
          Transcript saved
        </div>
        <a class="toast-link">View in /data</a>
      </div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // ---------- initial hidden state ----------
      tl.set(
        [
          ".seg[data-seg='1']",
          ".seg[data-seg='2']",
          ".seg[data-seg='3']",
          ".seg[data-seg='4']",
          ".seg[data-seg='5']",
          ".seg[data-seg='6']",
          ".seg[data-seg='7']",
          ".seg[data-seg='8']",
          ".seg[data-seg='9']",
          ".seg[data-seg='10']",
          ".seg[data-seg='11']",
          ".seg[data-seg='12']",
        ],
        { opacity: 0 },
        0
      );
      tl.set("#playhead", { opacity: 0 }, 0);
      tl.set("#popup", { opacity: 0, y: 10 }, 0);
      tl.set("#cursor", { opacity: 0 }, 0);
      tl.set("#audio-row", { opacity: 0 }, 0);
      tl.set("#ribbon", { opacity: 0 }, 0);
      tl.set("#speakers", { opacity: 0 }, 0);
      tl.set("#buttons", { opacity: 0 }, 0);

      // ---------- 0.0 – 0.4: HOOK fade in ----------
      tl.from(
        "#hook",
        { opacity: 0, y: 30, duration: 0.4, ease: "power2.out" },
        0
      );

      // 0.4 – 2.2: HOLD (1.8s)

      // ---------- 2.2 – 2.6: hook out, card in ----------
      tl.to(
        "#hook",
        { opacity: 0, y: -24, duration: 0.4, ease: "power2.in" },
        2.2
      );
      tl.fromTo(
        "#card",
        { opacity: 0, scale: 0.95 },
        { opacity: 1, scale: 1.0, duration: 0.4, ease: "power2.out" },
        2.2
      );

      // ---------- 2.6 – 3.2: audio + ribbon paint in ----------
      tl.to(
        "#audio-row",
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        2.6
      );
      tl.to(
        "#ribbon",
        { opacity: 1, duration: 0.15, ease: "power1.out" },
        2.6
      );
      const segStarts = [2.65, 2.70, 2.75, 2.80, 2.85, 2.90, 2.95, 3.00, 3.05, 3.10, 3.13, 3.16];
      segStarts.forEach((t, i) => {
        tl.to(
          `.seg[data-seg='${i + 1}']`,
          { opacity: 0.9, duration: 0.12, ease: "power1.out" },
          t
        );
      });
      tl.to("#playhead", { opacity: 1, duration: 0.15, ease: "power1.out" }, 3.1);
      tl.to(
        "#speakers",
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        2.7
      );
      tl.to(
        "#buttons",
        { opacity: 1, duration: 0.25, ease: "power2.out" },
        2.8
      );

      // ---------- 3.2 – 3.9: cursor glides to seg #5 middle ----------
      // VERTICAL LAYOUT (1080×1920):
      // card-wrap width = 940, centered at x=540, so card-wrap left edge ≈ 70 (screen) but cursor uses card-wrap-local coords.
      // card padding = 40
      // ribbon-wrap inside card: top = 40 (pad) + 80 (audio) + 36 (gap) = 156
      // ribbon-y center = 156 + 28 = 184
      // ribbon inner width = 940 - 80 = 860
      // cumulative up to seg5 start = 31% → 31% × 860 ≈ 266.6
      // seg5 width 12% × 860 ≈ 103.2, mid +51.6
      // playhead-x in card-wrap-local = 40 (pad) + 266.6 + 51.6 ≈ 358
      tl.fromTo(
        "#cursor",
        { x: 520, y: 480, opacity: 0 },
        { x: 520, y: 480, opacity: 1, duration: 0.2, ease: "power1.out" },
        3.2
      );
      tl.to(
        "#cursor",
        { x: 358, y: 184, duration: 0.5, ease: "power2.inOut" },
        3.3
      );

      // ---------- 3.9 – 4.2: popup appears ----------
      tl.to(
        "#popup",
        { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
        3.9
      );

      // 4.2 – 5.0: HOLD (800ms)

      // ---------- 5.0 – 5.2: popup fades, cursor → input-0 ----------
      tl.to(
        "#popup",
        { opacity: 0, y: 10, duration: 0.2, ease: "power2.in" },
        5.0
      );
      // input-0 y inside card-wrap:
      //   = 40 (pad) + 80 (audio) + 36 (gap) + 64 (ribbon-wrap) + 36 (gap)
      //   + ~33 (speakers-label height) + 20 (gap) + 32 (row half)
      //   ≈ 40 + 80 + 36 + 64 + 36 + 33 + 20 + 32 = 341
      // speaker-code width 220 + gap 20 → input starts at x = 40 + 220 + 20 = 280
      // cursor lands on left side of input, x ≈ 310
      tl.to(
        "#cursor",
        { x: 310, y: 341, duration: 0.2, ease: "power2.inOut" },
        5.0
      );
      tl.call(
        () => {
          const el = document.getElementById("input-0");
          if (el) el.classList.add("focused");
        },
        [],
        5.18
      );
      tl.to("#caret-0", { opacity: 1, duration: 0.05 }, 5.18);

      // ---------- 5.2 – 6.0: type "Daniel" ----------
      const name0 = "Daniel";
      name0.split("").forEach((ch, i) => {
        const t = 5.22 + i * 0.12;
        tl.call(
          (c) => {
            const el = document.getElementById("input-0-text");
            if (el) el.textContent = el.textContent + c;
          },
          [ch],
          t
        );
      });
      tl.call(
        () => {
          const el = document.getElementById("input-0");
          if (el) el.classList.remove("focused");
          const c = document.getElementById("caret-0");
          if (c) c.style.opacity = 0;
        },
        [],
        5.98
      );

      // ---------- 6.0 – 6.6: cursor → input-1, type "Alex" ----------
      // input-1 y = 341 + 64 (input height) + 20 (gap) = 425
      tl.to(
        "#cursor",
        { x: 310, y: 425, duration: 0.12, ease: "power2.inOut" },
        6.0
      );
      tl.call(
        () => {
          const el = document.getElementById("input-1");
          if (el) el.classList.add("focused");
        },
        [],
        6.13
      );
      tl.to("#caret-1", { opacity: 1, duration: 0.05 }, 6.13);
      const name1 = "Alex";
      name1.split("").forEach((ch, i) => {
        const t = 6.15 + i * 0.1;
        tl.call(
          (c) => {
            const el = document.getElementById("input-1-text");
            if (el) el.textContent = el.textContent + c;
          },
          [ch],
          t
        );
      });
      tl.call(
        () => {
          const el = document.getElementById("input-1");
          if (el) el.classList.remove("focused");
          const c = document.getElementById("caret-1");
          if (c) c.style.opacity = 0;
        },
        [],
        6.58
      );

      // ---------- 6.6 – 7.2: cursor → input-2, type "Pat" ----------
      // input-2 y = 425 + 64 + 20 = 509
      tl.to(
        "#cursor",
        { x: 310, y: 509, duration: 0.12, ease: "power2.inOut" },
        6.6
      );
      tl.call(
        () => {
          const el = document.getElementById("input-2");
          if (el) el.classList.add("focused");
        },
        [],
        6.73
      );
      tl.to("#caret-2", { opacity: 1, duration: 0.05 }, 6.73);
      const name2 = "Pat";
      name2.split("").forEach((ch, i) => {
        const t = 6.75 + i * 0.11;
        tl.call(
          (c) => {
            const el = document.getElementById("input-2-text");
            if (el) el.textContent = el.textContent + c;
          },
          [ch],
          t
        );
      });
      tl.call(
        () => {
          const el = document.getElementById("input-2");
          if (el) el.classList.remove("focused");
          const c = document.getElementById("caret-2");
          if (c) c.style.opacity = 0;
        },
        [],
        7.18
      );

      // 7.2 – 7.5: HOLD renamed (300ms)

      // ---------- 7.5 – 7.7: cursor → Save ----------
      // buttons row y = 509 + 64 + 20 + 8 + 32 = 633
      // Save center x = 940 (card-wrap right) - 40 (pad) - ~40 (btn half) = 860
      tl.to(
        "#cursor",
        { x: 850, y: 633, duration: 0.2, ease: "power2.inOut" },
        7.5
      );

      // ---------- 7.7 – 7.9: click invert ----------
      tl.call(
        () => {
          const el = document.getElementById("save-btn");
          if (el) el.classList.add("inverted");
        },
        [],
        7.7
      );
      tl.to(
        "#cursor",
        { scale: 0.85, duration: 0.08, ease: "power2.in" },
        7.7
      );
      tl.to(
        "#cursor",
        { scale: 1.0, duration: 0.08, ease: "power2.out" },
        7.78
      );
      tl.call(
        () => {
          const el = document.getElementById("save-btn");
          if (el) el.classList.remove("inverted");
        },
        [],
        7.88
      );

      // ---------- 7.9 – 8.5: toast slides in from right, holds ----------
      tl.fromTo(
        "#toast",
        { opacity: 0, x: 60 },
        { opacity: 1, x: 0, duration: 0.25, ease: "power2.out" },
        7.9
      );

      // 8.15 – 8.5: RESTING FRAME

      window.__timelines["slice-1-vert"] = tl;
    </script>
  </body>
</html>
