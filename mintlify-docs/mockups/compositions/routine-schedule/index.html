<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>IMP mockup — routine schedule</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="fonts.css" />
    <link rel="stylesheet" href="kit/app-shell.css" />
    <style>
      body { margin: 0; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
      #root .clip { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface-2); }

      /* ── workbench layout ── */
      #root .workbench-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

      /* ── section nav rail ── */
      #root .section-nav { width: 200px; flex: none; border-right: 1px solid var(--hair); background: var(--bg); padding: 16px 0; display: flex; flex-direction: column; gap: 2px; }
      #root .section-nav-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; font-size: 13px; color: var(--tx-mid); cursor: default; }
      #root .section-nav-item.active { background: var(--surface-2); color: var(--tx-hi); font-weight: 500; }
      #root .section-nav-item svg { width: 14px; height: 14px; stroke-width: 1.5; flex: none; }

      /* ── workbench content ── */
      #root .workbench-content { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
      #root .workbench-scroll { flex: 1; overflow: hidden; padding: 32px 48px; }
      #root .workbench-col { max-width: 680px; display: flex; flex-direction: column; gap: 24px; }

      /* ── DetailSection wrapper ── */
      #root .detail-section { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--hair); background: var(--surface); }
      #root .detail-section-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--hair); }
      #root .detail-section-title { font-size: 14px; font-weight: 600; color: var(--tx-hi); }
      #root .detail-section-meta { font-family: var(--font-mono); font-size: 12px; color: var(--tx-mid); }
      #root .detail-section-body { padding: 20px; display: flex; flex-direction: column; gap: 16px; }

      /* next-run line */
      #root .next-run-line { font-size: 12px; color: var(--tx-lo); }

      /* ── Tabs (Presets / Custom CRON) ── */
      #root .tabs-list { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border: 1px solid var(--hair); padding: 3px; gap: 2px; }
      #root .tab-trigger { display: flex; align-items: center; justify-content: center; padding: 7px 0; font-size: 13px; color: var(--tx-mid); cursor: default; }
      #root .tab-trigger.active { background: var(--bg); color: var(--tx-hi); font-weight: 500; border: 1px solid var(--hair); }

      /* ── Select (preset dropdown) ── */
      #root .select-label { font-size: 12px; font-weight: 500; color: var(--tx-hi); margin-bottom: 6px; }
      #root .select-trigger { display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--hair); background: var(--bg); padding: 8px 12px; font-size: 13px; color: var(--tx-hi); }
      #root .select-trigger-placeholder { color: var(--tx-lo); }
      #root .select-chevron { width: 14px; height: 14px; stroke-width: 2; color: var(--tx-lo); flex: none; }

      /* ── expression preview box (shown when a preset is selected) ── */
      #root .expr-box { background: var(--surface-2); border-radius: 4px; padding: 10px 14px; }
      #root .expr-box-label { font-size: 11px; color: var(--tx-lo); margin-bottom: 4px; }
      #root .expr-code { font-family: var(--font-mono); font-size: 13px; color: var(--tx-hi); }

      /* ── action buttons row ── */
      #root .action-row { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; }
      #root .btn-primary { background: var(--accent); color: #fff; border: none; padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: default; }
      #root .btn-outline { background: transparent; color: var(--tx-hi); border: 1px solid var(--hair); padding: 8px 18px; font-size: 13px; font-weight: 400; cursor: default; display: flex; align-items: center; gap: 6px; }
      #root .btn-outline svg { width: 14px; height: 14px; stroke-width: 1.5; color: var(--tx-mid); }

      /* breadcrumb / topbar extras */
      #root .topbar-breadcrumb { font-size: 13px; color: var(--tx-lo); }
      #root .topbar-breadcrumb-sep { color: var(--tx-faint); margin: 0 6px; }
      #root .topbar-breadcrumb-cur { font-size: 14px; font-weight: 600; color: var(--tx-hi); }
      #root .topbar-right { display: flex; align-items: center; gap: 8px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="routine-schedule"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="2"
    >
      <section id="scene" class="clip" data-start="0" data-duration="2" data-track-index="1">
        <div class="imp-shell">
          <!-- sidebar -->
          <aside class="imp-sidebar">
            <div class="imp-wordmark">IMP</div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Home
            </div>
            <div class="imp-sidebar-group">Workspace</div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>Chat
            </div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>Projects
            </div>
            <div class="imp-sidebar-group">Build</div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/></svg>Agents
            </div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/></svg>Knowledge
            </div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h8"/><path d="M8 12h4"/><path d="M8 18h2"/><rect x="2" y="2" width="20" height="20" rx="2"/></svg>Prompts
            </div>
            <div class="imp-nav-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/></svg>Skills
            </div>
            <div class="imp-nav-item active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-3"/><rect x="8" y="2" width="8" height="6" rx="1"/></svg>Routines
            </div>
          </aside>

          <!-- main area -->
          <div class="imp-main">
            <!-- topbar -->
            <div class="imp-topbar">
              <span>
                <span class="topbar-breadcrumb">Routines</span>
                <span class="topbar-breadcrumb-sep">/</span>
                <span class="topbar-breadcrumb-cur">Weekly digest</span>
              </span>
              <span class="topbar-right">
                <span class="imp-btn imp-btn-ghost">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;margin-right:5px;vertical-align:middle"><path d="M2.992 16.342a2 2 0 0 1 .094 1.167l-1.065 3.29a1 1 0 0 0 1.236 1.168l3.413-.998a2 2 0 0 1 1.099.092 10 10 0 1 0-4.777-4.719"/></svg>
                  Open chat
                </span>
                <span class="imp-btn imp-btn-ink">Run</span>
              </span>
            </div>

            <!-- workbench -->
            <div class="workbench-body">
              <!-- section nav -->
              <nav class="section-nav">
                <div class="section-nav-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
                  Basics
                </div>
                <div class="section-nav-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                  Access
                </div>
                <div class="section-nav-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M17 6.1H3"/><path d="M21 12.1H3"/><path d="M15.1 18H3"/></svg>
                  Steps
                </div>
                <div class="section-nav-item active">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                  Schedule
                </div>
                <div class="section-nav-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                  Runs
                </div>
                <div class="section-nav-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14"/><path d="M5 12h14"/><path d="M5 17h14"/></svg>
                  Queue
                </div>
                <div class="section-nav-item" style="color:var(--destructive)">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                  Danger zone
                </div>
              </nav>

              <!-- schedule content -->
              <div class="workbench-content">
                <div class="workbench-scroll">
                  <div class="workbench-col">

                    <!--
                      DetailSection: "Schedule"
                      meta slot: active cron shown as <code> in the header (schedule.tsx line 116)
                      Remove schedule button visible because currentCron is set (schedule.tsx line 157)
                    -->
                    <div class="detail-section">
                      <div class="detail-section-header">
                        <span class="detail-section-title">Schedule</span>
                        <!-- active cron in meta slot (schedule.tsx line 115–119) -->
                        <code class="detail-section-meta">0 0 * * 0</code>
                      </div>

                      <div class="detail-section-body">
                        <!-- next run line (schedule.tsx line 127–130) -->
                        <p class="next-run-line">Next run <span style="color:var(--tx-hi)">in 6 days</span></p>

                        <!--
                          ScheduleEditor — Presets tab active
                          (schedule-editor.tsx line 126–130: TabsList with two TabsTriggers)
                          tab labels from en.json:
                            "presets": "Presets"   (line 3464)
                            "custom": "Custom CRON" (line 3465)
                        -->
                        <div class="tabs-list">
                          <div class="tab-trigger active">Presets</div>
                          <div class="tab-trigger">Custom CRON</div>
                        </div>

                        <!--
                          Presets tab content (schedule-editor.tsx line 132–163)
                          Label: "Select a preset" (en.json line 3466 "selectPreset")
                          Dropdown placeholder: "Choose a preset…" (en.json line 3467 "chooseAPreset")
                          Selected: "Weekly on Sunday 00:00" (cron-presets.ts line 55)
                        -->
                        <div>
                          <div class="select-label">Select a preset</div>
                          <div class="select-trigger">
                            <span>Weekly on Sunday 00:00</span>
                            <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                          </div>
                        </div>

                        <!--
                          Expression preview box (schedule-editor.tsx line 155–162)
                          label from en.json line 3468 "expression": "CRON expression"
                          cron value: "0 0 * * 0" (cron-presets.ts line 57)
                        -->
                        <div class="expr-box">
                          <div class="expr-box-label">CRON expression</div>
                          <code class="expr-code">0 0 * * 0</code>
                        </div>

                        <!--
                          Action buttons (schedule.tsx line 142–168)
                          "Update schedule" shown because currentCron is set (en.json line 3448)
                          "Remove schedule" shown because currentCron is set (en.json line 3450)
                        -->
                        <div class="action-row">
                          <button class="btn-primary">Update schedule</button>
                          <button class="btn-outline">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            Remove schedule
                          </button>
                        </div>
                      </div>
                    </div>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      // Static mockup: a settled hold for the full duration, no motion.
      window.__timelines["routine-schedule"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
